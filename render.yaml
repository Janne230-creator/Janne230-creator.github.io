services:
  - type: web
    name: nexus-super-app
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: nexus-league-data
      mountPath: /var/data/creator-league
      sizeGB: 1
    envVars:
      - key: LEAGUE_DATA_DIR
        value: /var/data/creator-league
      - key: TRUST_PROXY
        value: "false"
